<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Próximo hogar · Andy &amp; Natalí</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="description" content="Oportunidades de casas y terrenos en el Gran Mendoza, ordenadas por puntaje.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-head">
    <div>
      <h1>Próximo hogar · Andy &amp; Natalí</h1>
      <p id="summary" class="muted">Cargando avisos…</p>
      <p id="new-banner" class="new-banner" hidden></p>
    </div>
    <button type="button" id="open-settings" class="btn">⚙ Configuración</button>
  </header>

  <form id="filters">
    <label>Precio mín. (USD)<input type="number" name="minUsd" min="0" step="1000" inputmode="numeric"></label>
    <label>Precio máx. (USD)<input type="number" name="maxUsd" min="0" step="1000" inputmode="numeric"></label>
    <div class="field" id="types-select"></div>
    <div class="field" id="departments-select"></div>
    <div class="field" id="sources-select"></div>
    <label>Ordenar
      <select name="sort">
        <option value="score">Mejor puntaje</option>
        <option value="price">Menor precio</option>
        <option value="discount">Más barato vs zona</option>
        <option value="newest">Más nuevos</option>
      </select>
    </label>
    <label class="range">Máx. al centro <output id="maxMinutes-out"></output><input type="range" name="maxMinutes" min="5" max="30" step="1"></label>
    <div class="checks">
      <label><input type="checkbox" name="onlyCredito"> Solo apto crédito</label>
      <label><input type="checkbox" name="onlyPatio"> Solo con patio</label>
      <label><input type="checkbox" name="hideSuspicious"> Ocultar precios sospechosos</label>
      <label><input type="checkbox" name="onlyFavorites"> Solo favoritos</label>
      <button type="reset" class="btn">Restablecer</button>
    </div>
  </form>

  <main id="list"></main>
  <button id="more" class="btn more" hidden>Ver más</button>

  <dialog id="detail" class="sheet"></dialog>
  <dialog id="settings" class="sheet"></dialog>
  <dialog id="carousel" class="carousel">
    <img class="carousel-img" alt="">
    <button type="button" class="carousel-nav prev" data-step="-1" aria-label="Foto anterior">‹</button>
    <button type="button" class="carousel-nav next" data-step="1" aria-label="Foto siguiente">›</button>
    <div class="carousel-bar">
      <span class="carousel-caption"></span>
      <span class="carousel-counter"></span>
      <button type="button" class="btn icon" data-action="close" aria-label="Cerrar">✕</button>
    </div>
  </dialog>

  <footer class="muted">Datos de Inmoclick e Inmoup. Precios publicados, no de cierre. Minutos estimados en línea recta × 1,8.</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
