<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Mendoza</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Oportunidades de casas y terrenos en el Gran Mendoza, ordenadas por puntaje.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./"><img src="favicon.svg" alt="" width="28" height="28"><span>Casa Mendoza</span></a>
      <div class="topbar-actions">
        <div id="theme-picker"></div>
        <button type="button" id="open-runs" class="icon-btn ghost" title="Registro de corridas" aria-label="Registro de corridas" data-icon="activity" hidden></button>
        <button type="button" id="open-settings" class="icon-btn ghost" title="Configuración" aria-label="Configuración" data-icon="gear"></button>
        <div id="account" class="account"></div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Casas, deptos y terrenos en el Gran Mendoza</h1>
      <p id="summary" class="hero-meta">Cargando avisos…</p>
      <p id="new-banner" class="new-banner" hidden></p>
    </section>

    <form id="filters" class="toolbar">
      <div class="segmented operation" role="radiogroup" aria-label="Operación">
        <label><input type="radio" name="operation" value="venta"><span>Comprar</span></label>
        <label><input type="radio" name="operation" value="alquiler"><span>Alquilar</span></label>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Tipo">
        <label><input type="radio" name="typeChoice" value=""><span>Todo</span></label>
        <label><input type="radio" name="typeChoice" value="casa"><span>Casas</span></label>
        <label><input type="radio" name="typeChoice" value="departamento"><span>Deptos</span></label>
        <label data-op="venta"><input type="radio" name="typeChoice" value="terreno"><span>Terrenos</span></label>
      </div>
      <label class="price-field" data-op="venta"><span>Hasta USD</span><input type="number" name="maxUsd" min="0" step="1000" inputmode="numeric" aria-label="Precio máximo en USD"></label>
      <label class="price-field" data-op="alquiler"><span>Hasta $/mes</span><input type="number" name="maxArs" min="0" step="50000" inputmode="numeric" aria-label="Alquiler máximo por mes en pesos"></label>
      <div class="field toolbar-select" id="departments-select"></div>
      <label class="toggle-chip" data-op="venta"><input type="checkbox" name="onlyCredito"><span>Apto crédito</span></label>
      <details class="more-filters">
        <summary class="btn"><span data-icon="sliders"></span>Más filtros<span id="more-count" class="badge" hidden></span></summary>
        <div class="more-panel">
          <label class="field" data-op="venta">Precio mínimo (USD)<input type="number" name="minUsd" min="0" step="1000" inputmode="numeric"></label>
          <label class="field" data-op="alquiler">Alquiler mínimo ($/mes)<input type="number" name="minArs" min="0" step="50000" inputmode="numeric"></label>
          <div class="field" id="sources-select"></div>
          <label class="field">Máximo al centro <output id="maxMinutes-out"></output><input type="range" name="maxMinutes" min="5" max="30" step="1"></label>
          <label class="check-row"><input type="checkbox" name="onlyPatio"><span>Solo con patio</span></label>
          <label class="check-row"><input type="checkbox" name="hideSuspicious"><span>Ocultar precios sospechosos<small>Más de 55% por debajo de la zona. Suelen ser errores del aviso, anticipos o cuotas.</small></span></label>
          <button type="reset" class="btn">Limpiar filtros</button>
        </div>
      </details>
    </form>

    <div class="results-bar">
      <nav class="tabs" role="tablist">
        <button type="button" class="tab" data-tab="all" role="tab">Todos <span id="all-count" class="count"></span></button>
        <button type="button" class="tab" data-tab="favorites" role="tab"><span data-icon="heart"></span>Favoritos <span id="fav-count" class="count"></span></button>
      </nav>
      <label class="sort"><span>Ordenar</span>
        <select name="sort" form="filters">
          <option value="score">Mejor puntaje</option>
          <option value="price">Menor precio</option>
          <option value="discount">Más barato vs zona</option>
          <option value="newest">Más nuevos</option>
        </select>
      </label>
    </div>
    <p id="list-note" class="list-note" hidden></p>

    <div id="list" class="grid"></div>
    <button id="more" class="btn more" hidden>Ver más</button>

    <footer>
      <p>Datos de Inmoclick e Inmoup. Precios publicados, no de cierre. Minutos estimados en línea recta × 1,8.</p>
      <p><a href="privacidad.html">Privacidad</a> · <a href="condiciones.html">Condiciones</a></p>
    </footer>
  </main>

  <dialog id="detail" class="sheet"></dialog>
  <dialog id="settings" class="sheet"></dialog>
  <dialog id="runs" class="sheet"></dialog>
  <dialog id="carousel" class="carousel">
    <img class="carousel-img" alt="">
    <button type="button" class="carousel-nav prev" data-step="-1" aria-label="Foto anterior">‹</button>
    <button type="button" class="carousel-nav next" data-step="1" aria-label="Foto siguiente">›</button>
    <div class="carousel-bar">
      <span class="carousel-caption"></span>
      <span class="carousel-counter"></span>
      <button type="button" class="icon-btn ghost" data-action="close" aria-label="Cerrar" data-icon="close"></button>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
