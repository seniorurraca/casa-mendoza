name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          url="https://inmoclick.com/inmuebles/venta/casas/mendoza?limit=200&page=1"
          curl -s -o page.html -w "status %{http_code} bytes %{size_download}\n" -A "Mozilla/5.0 (compatible; casa-mendoza personal research)" "$url"
          echo "articles $(grep -o '<article' page.html | wc -l)"
          echo "lastPage $(grep -oE '(\?|&amp;|&)page=[0-9]+' page.html | grep -oE '[0-9]+$' | sort -n | tail -1)"
