name: Scrape

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 1,5,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: full o quick
        default: full
        type: choice
        options: [full, quick]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run scrape -- --mode ${{ github.event.schedule == '0 1,5,13,17,21 * * *' && 'quick' || inputs.mode || 'full' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: actualizar avisos $(date -u +%F)"
          git push
